<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VolariX — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500&family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="supabase.config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="volarix-auth.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0D0F1A;--bg2:#13162A;--bg3:#1A1D30;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--text:#F0EFF8;--text3:#555370;--cyan:#00D4AA;--cyan-bg:rgba(0,212,170,.1);--cyan-dim:rgba(0,212,170,.25);--red:#FF4757;--red-bg:rgba(255,71,87,.1);--red-dim:rgba(255,71,87,.25);--purple:#8B7FFF;--purple-dim:rgba(139,127,255,.28);--font:'Bricolage Grotesque',sans-serif;--r:10px;--rxl:22px}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px}body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;position:relative;overflow:hidden}body::before{content:'';position:fixed;inset:0;opacity:.04;background-image:linear-gradient(var(--cyan) 1px,transparent 1px),linear-gradient(90deg,var(--cyan) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}body::after{content:'';position:fixed;top:20%;left:10%;width:500px;height:500px;background:radial-gradient(circle,rgba(139,127,255,.06) 0%,transparent 70%);pointer-events:none}
.auth-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rxl);padding:40px 36px;width:100%;max-width:400px;box-shadow:0 32px 100px rgba(0,0,0,.5);position:relative;z-index:2}.logo{display:flex;align-items:center;gap:8px;margin-bottom:28px;justify-content:center}.logo-hex{width:28px;height:28px;background:linear-gradient(135deg,var(--cyan),var(--purple));clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)}.logo-name{font-size:20px;font-weight:800;letter-spacing:-.03em}.field-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:7px}input{width:100%;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r);padding:11px 14px;font-family:var(--font);font-size:13px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}input:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-dim)}.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:var(--font);font-size:13px;font-weight:700;padding:12px;border-radius:var(--r);cursor:pointer;border:none;transition:all .15s;letter-spacing:.01em}.btn-primary{background:var(--purple);color:#fff}.btn-primary:hover{opacity:.88}.btn-primary:disabled{opacity:.4;cursor:not-allowed}.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none}@keyframes spin{to{transform:rotate(360deg)}}.msg{font-size:12px;padding:10px 14px;border-radius:var(--r);margin-bottom:16px;display:none}.msg.show{display:block}.msg-error{background:var(--red-bg);color:var(--red);border:1px solid var(--red-dim)}.msg-success{background:var(--cyan-bg);color:var(--cyan);border:1px solid var(--cyan-dim)}.security-note{font-size:10px;color:var(--text3);text-align:center;margin-top:18px;line-height:1.5}.back-link{text-align:center;margin-top:16px;font-size:11px;color:var(--text3)}.back-link a{color:var(--text3);text-decoration:none}.back-link a:hover{color:var(--text)}
</style>
</head>
<body>
<main class="auth-card">
  <div class="logo"><div class="logo-hex"></div><span class="logo-name">Volari<span style="color:var(--cyan)">X</span></span></div>
  <div class="msg msg-error" id="errorMsg" role="alert"></div>
  <div class="msg msg-success" id="successMsg" role="status"></div>
  <div style="font-size:16px;font-weight:700;margin-bottom:4px">Private access</div>
  <div style="font-size:12px;color:var(--text3);margin-bottom:22px">Sign in with your authorized VolariX account.</div>
  <form id="loginForm">
    <div style="margin-bottom:14px"><div class="field-label">Email Address</div><input type="email" id="loginEmail" autocomplete="email" required></div>
    <div style="margin-bottom:20px"><div class="field-label">Password</div><input type="password" id="loginPass" autocomplete="current-password" required></div>
    <button class="btn btn-primary" id="loginBtn" type="submit"><span id="loginBtnText">Sign In</span><div class="spinner" id="loginSpinner"></div></button>
  </form>
  <div class="security-note">Access is limited to the account configured by the site owner. VolariX provides educational and analytical tools only. Not financial advice.</div>
</main>
<div class="back-link"><a href="index.html">← Back to VolariX</a></div>
<script>
const errorMsg = document.getElementById('errorMsg');
const successMsg = document.getElementById('successMsg');
function showError(message) { errorMsg.textContent = message; errorMsg.classList.add('show'); successMsg.classList.remove('show'); }
function showSuccess(message) { successMsg.textContent = message; successMsg.classList.add('show'); errorMsg.classList.remove('show'); }
function setLoading(loading) { document.getElementById('loginBtn').disabled = loading; document.getElementById('loginBtnText').textContent = loading ? 'Signing in...' : 'Sign In'; document.getElementById('loginSpinner').style.display = loading ? 'inline-block' : 'none'; }
function isConfigured() { return !!(window.volarixAuth && window.volarixAuth.getClient()); }
async function checkExistingSession() {
  if (!isConfigured()) { showError('Private authentication is not configured yet.'); return; }
  const user = await window.volarixAuth.requireUser();
  if (user) {
    showSuccess('Already signed in (' + (user.email || '') + '). Opening dashboard...');
    window.location.replace('app.html');
  }
}
document.getElementById('loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  if (!isConfigured()) { showError('Private authentication is not configured yet.'); return; }
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  setLoading(true);
  const { error } = await window.volarixAuth.signInWithPassword(email, password);
  setLoading(false);
  if (error) { showError('Sign-in failed. Check your email and password.'); return; }
  showSuccess('Signed in. Opening your dashboard...');
  window.location.replace('app.html');
});
checkExistingSession();
</script>
</body>
</html>
